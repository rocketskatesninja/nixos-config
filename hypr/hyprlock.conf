general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = /home/nope/images/wallpaper/nixos1.png
    blur_passes = 2
    blur_size = 5
    brightness = 0.5
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +'%I:%M %p'
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    color = rgba(cdd6f4ff)
    position = 0, 200
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +'%A, %B %-d'
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    color = rgba(a6adc8ff)
    position = 0, 120
    halign = center
    valign = center
}

# Battery
label {
    monitor =
    text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 | xargs -I{} echo "󰁹 {}%"
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = rgba(a6e3a1ff)
    position = 0, 60
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(1e1e2eff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = true
    placeholder_text = <i>Password</i>
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -100
    halign = center
    valign = center
}
