# Environment
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = GTK_USE_PORTAL,1
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
env = GTK_THEME,Adwaita:dark

# Dark mode
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface cursor-theme Adwaita
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24

# Monitor
monitor = ,preferred,auto,1

# Wallpaper
exec-once = swaybg -i /home/nope/images/wallpaper/lock-screen.jpg -m fill

# Layout - master layout for the split pattern you wanted
general {
    layout = master
    border_size = 2
    gaps_in = 5
    gaps_out = 5
    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)
}

master {
    new_status = slave
    mfact = 0.5
}

# Appearance
decoration {
    rounding = 0
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = default, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, default
    animation = workspaces, 1, 3, default
}

# Input
input {
    touchpad {
        tap-to-click = true
        natural_scroll = false
    }
}

# Startup apps
exec-once = waybar 2>/dev/null
exec-once = mako
exec-once = nm-applet --indicator
exec-once = wl-paste --watch cliphist store
exec-once = swayidle -w timeout 600 'swaylock -f' timeout 900 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' timeout 1800 'systemctl suspend' before-sleep 'swaylock -f; sleep 1'

# Workspace assignments
windowrulev2 = workspace 1, class:^(foot)$
windowrulev2 = workspace 1, class:^(thunar)$
windowrulev2 = workspace 2, class:^(firefox)$
windowrulev2 = workspace 3, class:^(thunderbird)$

# Launch apps on startup
exec-once = foot
exec-once = foot
exec-once = thunar
exec-once = firefox
exec-once = thunderbird

# Keybindings
$mod = SUPER

bind = $mod, Return, exec, foot
bind = $mod, D, exec, wofi --show drun
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, E, exec, echo -e "Yes\nNo" | wofi --dmenu --prompt "Exit Hyprland?" --width 200 --height 100 | grep -q "Yes" && hyprctl dispatch exit
bind = $mod, L, exec, swaylock -f
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, Space, togglefloating
bind = $mod, Space, cyclenext

# Media/hardware keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Network reset panic button
bind = $mod, N, exec, net-reset

# Screenshots
bind = , Print, exec, grim ~/images/screenshots/$(date +'%Y%m%d_%H%M%S').png && notify-send "Screenshot" "Full screen captured"
bind = $mod, Print, exec, grim -g "$(slurp)" ~/images/screenshots/$(date +'%Y%m%d_%H%M%S').png

# Focus
bind = $mod, Left, movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up, movefocus, u
bind = $mod, Down, movefocus, d

# Move windows
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Right, movewindow, r
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Down, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = CTRL, Tab, workspace, e+1
bind = CTRL SHIFT, Tab, workspace, e-1
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4

# Alt+Tab
bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev

# Resize
bind = $mod, R, submap, resize
submap = resize
bind = , Left, resizeactive, -10 0
bind = , Right, resizeactive, 10 0
bind = , Up, resizeactive, 0 -10
bind = , Down, resizeactive, 0 10
bind = , Escape, submap, reset
submap = reset

# Lid close lock
bindl = , switch:Lid Switch, exec, swaylock -f
