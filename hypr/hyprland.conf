# Environment
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = GTK_USE_PORTAL,1
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# Nord to match noctalia-shell's active color scheme — GTK apps (Thunar,
# virt-manager) otherwise default to plain Adwaita, clashing with the rest
# of the desktop.
env = GTK_THEME,Nordic-darker

# Explicit blank-password keyring unlock, early. The PAM hooks on
# sddm-autologin (see configuration.nix) only unlock the on-disk keyring
# file for the *login-triggered* gnome-keyring-daemon instance; the
# separate instance D-Bus-activates via org.freedesktop.secrets when an
# app first requests it (a different process, not PAM-unlocked) and was
# prompting interactively on first touch. This unlocks that one too,
# before anything else gets a chance to trigger the prompt.
exec-once = sh -c 'echo -n "" | gnome-keyring-daemon --unlock'

# Dark mode — dconf write, not gsettings set: gsettings-desktop-schemas nests
# its .xml under share/gsettings-schemas/<name>/ instead of share/glib-2.0/schemas/,
# so the bare gsettings CLI never sees it ("No schemas installed") even though
# properly-wrapped GTK apps read the dconf value fine via their own schema path.
exec-once = dconf write /org/gnome/desktop/interface/color-scheme "'prefer-dark'"
exec-once = dconf write /org/gnome/desktop/interface/gtk-theme "'Nordic-darker'"
exec-once = dconf write /org/gnome/desktop/interface/cursor-theme "'Adwaita'"
exec-once = dconf write /org/gnome/desktop/interface/cursor-size 24

# Monitor
monitor = ,preferred,auto,1

# Keep all 3 workspaces around even when empty (e.g. closing firefox
# shouldn't make workspace 2 disappear from the switcher).
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true

# Layout - master layout for the split pattern you wanted
general {
    layout = master
    border_size = 2
    gaps_in = 5
    gaps_out = 5
    col.active_border = rgba(3584e4ee)
    col.inactive_border = rgba(595959aa)
}

master {
    new_status = slave
    mfact = 0.5
}

misc {
    focus_on_activate = true
}

# Appearance
decoration {
    rounding = 0
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = default, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, default
    animation = workspaces, 1, 3, default, slidefade
}

# Input
input {
    numlock_by_default = true
    follow_mouse = 1

    touchpad {
        tap-to-click = true
        natural_scroll = false
    }
}

# Startup apps
# Re-asserts the lowercase XDG dirs (~/.config/user-dirs.dirs) each login —
# without this, apps that create their own XDG dir on first run (e.g. a
# music player defaulting to ~/Music) drift back to the spec-default
# capitalized names since nothing else on this system runs the tool.
exec-once = xdg-user-dirs-update

# noctalia-shell owns the bar, launcher, notifications, wallpaper, idle/DPMS
# handling and the lock screen — replaces waybar/wofi/mako/hyprlock/swaybg.
exec-once = noctalia-shell
exec-once = wl-paste --watch cliphist store

# Suspend-then-hibernate after 30min idle on battery only (noctalia handles
# the screen dim/lock/DPMS side of idle; this is just the power-state trigger).
exec-once = swayidle -w timeout 1800 '[ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null | head -1)" != "1" ] && systemctl suspend-then-hibernate'

# System idle screensaver — no open/close animation. Fullscreen itself is
# handled by an explicit hyprctl dispatch in launch-screensaver, not a
# windowrule — static "fullscreen 1" rules don't reliably apply at window
# creation, so a dispatch after the window maps is the only mechanism that
# actually works.
windowrule = animation none, match:class org.zorro.screensaver

# Window transparency — "override" forces an absolute value; without it,
# opacity is only a multiplier during the open/focus animation and settles
# back to fully opaque once the window finishes launching.
windowrule = opacity 0.80 override 0.80 override, match:class kitty
windowrule = opacity 0.80 override 0.80 override, match:class thunar
windowrule = opacity 0.80 override 0.80 override, match:class .virt-manager-wrapped

# Workspace assignments
windowrule = workspace 1 class:kitty
windowrule = workspace 1 class:thunar
windowrule = workspace 2 class:firefox
windowrule = workspace 3 class:thunderbird

# Launch apps on startup — [workspace N silent] assigns the workspace at
# spawn time. The windowrule-based assignment above races cold-boot timing
# (firefox/thunderbird take longer to map than foot/thunar, and can lose
# the class-match race and land wherever's currently focused); this doesn't.
exec-once = [workspace 1 silent] kitty
exec-once = [workspace 1 silent] kitty
exec-once = [workspace 1 silent] thunar
exec-once = [workspace 2 silent] firefox
exec-once = [workspace 3 silent] thunderbird

# Keybindings
$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, D, exec, /home/nope/.local/bin/noctalia-ipc launcher toggle
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, E, exit,
bind = $mod, L, exec, /home/nope/.local/bin/noctalia-ipc lockScreen lock
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, Space, togglefloating
bind = $mod, Space, cyclenext
bind = $mod, M, layoutmsg, swapwithmaster

# Media/hardware keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Network reset panic button
bind = $mod, N, exec, net-reset

# Screenshots
bind = , Print, exec, grim ~/images/screenshots/$(date +'%Y%m%d_%H%M%S').png && notify-send "Screenshot" "Full screen captured"
bind = $mod, Print, exec, grim -g "$(slurp)" ~/images/screenshots/$(date +'%Y%m%d_%H%M%S').png

# Focus
bind = $mod, Left, movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up, movefocus, u
bind = $mod, Down, movefocus, d

# Move windows
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Right, movewindow, r
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Down, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = CTRL, Tab, exec, /home/nope/.local/bin/workspace-cycle next
bind = CTRL SHIFT, Tab, exec, /home/nope/.local/bin/workspace-cycle prev
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3

# Alt+Tab
bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev

# Resize
bind = $mod, R, submap, resize
submap = resize
bind = , Left, resizeactive, -10 0
bind = , Right, resizeactive, 10 0
bind = , Up, resizeactive, 0 -10
bind = , Down, resizeactive, 0 10
bind = , Escape, submap, reset
submap = reset

# Lid close lock
bindl = , switch:Lid Switch, exec, /home/nope/.local/bin/noctalia-ipc lockScreen lock
