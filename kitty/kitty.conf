font_family JetBrainsMono Nerd Font
font_size 14.0

# Trail animation follows the cursor as it moves — the effect that prompted
# switching to kitty in the first place. Value is ms of cursor stability
# before a trail triggers; kept low so it feels near-instant.
cursor_trail 1

# Nord — matches the Nordic-darker GTK theme (hypr/hyprland.conf) so the
# terminal follows the rest of the desktop instead of clashing with it.
background            #2E3440
foreground            #D8DEE9
selection_background  #4C566A
selection_foreground  #D8DEE9
cursor                #D8DEE9

color0  #3B4252
color1  #BF616A
color2  #A3BE8C
color3  #EBCB8B
color4  #81A1C1
color5  #B48EAD
color6  #88C0D0
color7  #E5E9F0
color8  #4C566A
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #81A1C1
color13 #B48EAD
color14 #8FBCBB
color15 #ECEFF4
